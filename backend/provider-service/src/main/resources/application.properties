# ===== Configuration commune =====
spring.application.name=provider-service
server.port=8083

# Profil actif par defaut : local (Eureka desactive).
# Pour l'integration : -Dspring.profiles.active=integration
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===== MySQL (base independante du service) =====
spring.datasource.url=jdbc:mysql://localhost:3306/provider_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
