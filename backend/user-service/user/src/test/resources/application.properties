spring.application.name=user-service

# H2 In-Memory Database for tests (MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:reservation;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable Eureka during tests
eureka.client.enabled=false

# JWT test configuration
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tc2lnbmluZy1hdC1sZWFzdC0zMi1ieXRlcw==
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# Rate limit generous default for general tests (overridden in rate-limiter test)
rate-limit.enabled=true
rate-limit.max-requests=1000
rate-limit.window-seconds=60
