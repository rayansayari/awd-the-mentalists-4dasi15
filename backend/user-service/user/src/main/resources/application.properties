spring.application.name=user-service
spring.config.import=optional:file:.env[.properties]
server.port=8081

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/reservation?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Eureka Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# JWT Configuration (override jwt.secret in production via env var JWT_SECRET)
jwt.secret=${JWT_SECRET:Y2hhbmdlLXRoaXMtc2VjcmV0LWtleS1pbi1wcm9kdWN0aW9uLWF0LWxlYXN0LTMyLWJ5dGVz}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Rate Limiting
rate-limit.enabled=true
rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:100}
rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
