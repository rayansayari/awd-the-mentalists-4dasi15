spring.application.name=catalogue-service

# H2 In-Memory Database for tests (MariaDB compatibility mode)
spring.datasource.url=jdbc:h2:mem:catalogue_test_db;MODE=MariaDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable Eureka during tests
eureka.client.enabled=false

# JWT test configuration
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tc2lnbmluZy1hdC1sZWFzdC0zMi1ieXRlcw==
