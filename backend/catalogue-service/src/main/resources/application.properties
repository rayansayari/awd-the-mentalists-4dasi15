spring.application.name=catalogue-service
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8082}

# Profil actif par defaut : local (Eureka desactive).
# Pour l'integration : SPRING_PROFILES_ACTIVE=integration
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# MariaDB Configuration
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/catalogue_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=com.reserv.catalogue.config.CompatMariaDBDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration (must match user-service JWT_SECRET)
jwt.secret=${JWT_SECRET:Y2hhbmdlLXRoaXMtc2VjcmV0LWtleS1pbi1wcm9kdWN0aW9uLWF0LWxlYXN0LTMyLWJ5dGVz}
